[project]
name = "structural-design"
version = "0.1.0"
description = "Quarto・marimo と Python による構造計算書"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "pyyaml>=6,<7",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "tabulate>=0.9,<1",
    "marimo>=0.23,<0.24",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
